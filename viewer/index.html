<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Self-Evolving World</title>
<style>
  :root {
    --bg-top: #0d1512;
    --bg-bottom: #060907;
    --grid-line: rgba(127, 217, 155, 0.05);
    --creature-low: #3f6b52;
    --creature-high: #9fffc4;
    --hunter-low: #6b1f1f;
    --hunter-high: #ff8f6b;
    --resource: #e8c07d;
    --text: #cfe8d6;
    --muted: #5c7266;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-bottom);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .frame {
    position: relative;
    width: 440px;
    max-width: 100%;
  }
  canvas {
    width: 100%;
    background: radial-gradient(circle at 50% 20%, var(--bg-top), var(--bg-bottom) 75%);
    border: 1px solid #1a2b20;
    border-radius: 6px;
    display: block;
  }
  #stats {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  #stats b { color: var(--text); font-weight: 600; }
  h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: lowercase;
    margin-bottom: 18px;
  }
  #legend {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .swatch { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tri {
    width: 0; height: 0; display: inline-block;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 8px solid;
  }
</style>
</head>
<body>
  <h1>self-evolving world</h1>
  <div class="frame">
    <canvas id="c" width="440" height="440"></canvas>
  </div>
  <div id="stats">loading...</div>
  <div id="legend">
    <span class="swatch"><span class="dot" style="background:var(--creature-high)"></span>grazer (brighter = more energy)</span>
    <span class="swatch"><span class="tri" style="border-bottom-color:var(--hunter-high)"></span>hunter (brighter = more energy)</span>
    <span class="swatch"><span class="dot" style="background:var(--resource)"></span>resource</span>
  </div>

<script>
const GRID = 40;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');
let cell = canvas.width / GRID;

function resize() {
  const displayWidth = canvas.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = displayWidth * dpr;
  canvas.height = displayWidth * dpr;
  cell = canvas.width / GRID;
}
window.addEventListener('resize', resize);
resize();

function lerpColor(a, b, t) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16));
  const pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  const p = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${p[0]},${p[1]},${p[2]})`;
}

async function render() {
  let world;
  try {
    const res = await fetch('../state/world.json?_=' + Date.now());
    world = await res.json();
  } catch (e) {
    stats.textContent = 'could not load state/world.json - run driver.py simulate first, and serve this folder over http:// (not file://)';
    return;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // faint grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i += 5) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height);
    ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell);
    ctx.stroke();
  }

  // resources: small diamonds
  const resourceColor = '#e8c07d';
  for (const r of world.resources || []) {
    const cx = r.x * cell + cell / 2;
    const cy = r.y * cell + cell / 2;
    const s = cell * 0.22;
    ctx.fillStyle = resourceColor;
    ctx.beginPath();
    ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy);
    ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy);
    ctx.closePath();
    ctx.fill();
  }

  // grazers: circle, brightness + size scale with energy, faint glow
  const creatures = world.creatures || [];
  for (const c of creatures) {
    if (c.species === 'hunter') continue;
    const t = Math.max(0, Math.min(1, (c.energy ?? 30) / 80));
    const color = lerpColor('#3f6b52', '#9fffc4', t);
    const r = cell * (0.16 + 0.14 * t);
    const cx = c.x * cell + cell / 2;
    const cy = c.y * cell + cell / 2;

    ctx.shadowColor = color;
    ctx.shadowBlur = 4 + 6 * t;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // hunters: triangle (a predator silhouette, distinct from the grazer dot),
  // red/orange ramp instead of green so the two species read apart at a
  // glance even before you know the shape convention.
  for (const c of creatures) {
    if (c.species !== 'hunter') continue;
    const t = Math.max(0, Math.min(1, (c.energy ?? 30) / 80));
    const color = lerpColor('#6b1f1f', '#ff8f6b', t);
    const r = cell * (0.22 + 0.14 * t);
    const cx = c.x * cell + cell / 2;
    const cy = c.y * cell + cell / 2;

    ctx.shadowColor = color;
    ctx.shadowBlur = 5 + 7 * t;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r * 0.87, cy + r * 0.5);
    ctx.lineTo(cx - r * 0.87, cy + r * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  const grazerCount = creatures.filter(c => c.species !== 'hunter').length;
  const hunterCount = creatures.filter(c => c.species === 'hunter').length;

  stats.innerHTML =
    `tick <b>${world.tick}</b>` +
    `<span>grazers <b>${world.grazers ?? grazerCount}</b></span>` +
    `<span>hunters <b>${world.hunters ?? hunterCount}</b></span>` +
    `<span>resources <b>${(world.resources || []).length}</b></span>`;
}

render();
setInterval(render, 3000);
</script>
</body>
</html>
