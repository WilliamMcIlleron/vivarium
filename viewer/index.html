<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vivarium</title>
<style>
  :root {
    --bg-top: #0d1512;
    --bg-bottom: #060907;
    --grid-line: rgba(0, 0, 0, 0.06);
    --creature-low: #3f6b52;
    --creature-high: #9fffc4;
    --hunter-low: #6b1f1f;
    --hunter-high: #ff8f6b;
    --resource: #e8c07d;
    --text: #cfe8d6;
    --muted: #5c7266;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg-bottom);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
    min-height: 100vh;
  }
  .frame {
    position: relative;
    width: 440px;
    max-width: 100%;
  }
  canvas {
    width: 100%;
    background: radial-gradient(circle at 50% 20%, var(--bg-top), var(--bg-bottom) 75%);
    border: 1px solid #1a2b20;
    border-radius: 6px;
    display: block;
  }
  #stats {
    margin-top: 14px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  #stats b { color: var(--text); font-weight: 600; }
  h1 {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: lowercase;
    margin-bottom: 18px;
  }
  #legend {
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    align-items: center;
  }
  .swatch { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .tri {
    width: 0; height: 0; display: inline-block;
    border-left: 4px solid transparent;
    border-right: 4px solid transparent;
    border-bottom: 8px solid;
  }
  #latest-evolve {
    margin-top: 22px;
    width: 100%;
    max-width: 440px;
    border-top: 1px solid #1a2b20;
    padding-top: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  #latest-evolve .label {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 10px;
    color: var(--muted);
    opacity: 0.7;
  }
  #latest-evolve .stamp { color: var(--text); font-weight: 600; margin-left: 6px; }
  #latest-evolve .entry { margin-top: 4px; line-height: 1.5; color: var(--text); }
</style>
</head>
<body>
  <h1>vivarium</h1>
  <div class="frame">
    <canvas id="c" width="440" height="440"></canvas>
  </div>
  <div id="stats">loading...</div>
  <div id="legend">
    <span class="swatch"><span class="dot" style="background:var(--creature-high)"></span>grazer (brighter = more energy)</span>
    <span class="swatch"><span class="tri" style="border-bottom-color:var(--hunter-high)"></span>hunter (brighter = more energy)</span>
    <span class="swatch"><span class="dot" style="background:var(--resource)"></span>resource</span>
  </div>
  <div id="latest-evolve"></div>

<script>
const GRID = 40;
const DAY_LENGTH_TICKS = 48;   // one full day/night cycle per real calendar day, at the default 30-min simulate schedule
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stats = document.getElementById('stats');
let cell = canvas.width / GRID;
let latestWorld = null;

function resize() {
  const displayWidth = canvas.clientWidth;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = displayWidth * dpr;
  canvas.height = displayWidth * dpr;
  cell = canvas.width / GRID;
}
window.addEventListener('resize', resize);
resize();

function lerpColor(a, b, t) {
  const pa = a.match(/\w\w/g).map(h => parseInt(h, 16));
  const pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
  const p = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return `rgb(${p[0]},${p[1]},${p[2]})`;
}

function shade(hex, amount) {
  const [r, g, b] = hex.match(/\w\w/g).map(h => parseInt(h, 16));
  const adj = v => Math.max(0, Math.min(255, Math.round(v + amount * 255)));
  return `rgb(${adj(r)},${adj(g)},${adj(b)})`;
}

// Deterministic per-cell hash (not Math.random) so terrain shading doesn't
// flicker to a new random value on every 3-second data refresh - the same
// tile always jitters the same way.
function hash01(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  h = h ^ (h >>> 16);
  return ((h >>> 0) % 1000) / 1000;
}

const TERRAIN_COLOR = { w: '#1c3a4a', s: '#8a7454', g: '#1f3324', f: '#12200e' };

function drawTerrain(terrain) {
  if (!terrain || !terrain.length) return;
  for (let y = 0; y < terrain.length; y++) {
    const row = terrain[y];
    for (let x = 0; x < row.length; x++) {
      const base = TERRAIN_COLOR[row[x]] || TERRAIN_COLOR.g;
      const jitter = (hash01(x, y) - 0.5) * 0.16;
      ctx.fillStyle = shade(base, jitter);
      ctx.fillRect(x * cell, y * cell, cell + 0.5, cell + 0.5);
    }
  }

  // faint grid, drawn low-opacity over terrain purely to help track motion
  // in increments of a cell - not meant to read as a spreadsheet.
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i += 5) {
    ctx.beginPath();
    ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, GRID * cell);
    ctx.moveTo(0, i * cell); ctx.lineTo(GRID * cell, i * cell);
    ctx.stroke();
  }
}

// Day/night: a full cycle over DAY_LENGTH_TICKS of simulated time (not real
// elapsed viewing time) - the world's own clock, not the browser's.
function drawDayNight(tick) {
  const phase = ((tick % DAY_LENGTH_TICKS) + DAY_LENGTH_TICKS) % DAY_LENGTH_TICKS / DAY_LENGTH_TICKS;
  const light = (1 - Math.cos(phase * Math.PI * 2)) / 2; // 0 = midnight, 1 = midday
  const nightAlpha = (1 - light) * 0.55;
  ctx.fillStyle = `rgba(6, 10, 22, ${nightAlpha})`;
  ctx.fillRect(0, 0, GRID * cell, GRID * cell);
}

// Slow-drifting fog banks, purely decorative, animated on wall-clock time
// (independent of how often world.json is actually re-fetched) so the
// world still feels alive between data refreshes.
const FOG_BANKS = [
  { ox: 0.15, oy: 0.30, r: 0.32, speed: 0.00006, phase: 0 },
  { ox: 0.70, oy: 0.60, r: 0.28, speed: 0.00004, phase: 2.1 },
  { ox: 0.45, oy: 0.80, r: 0.24, speed: 0.00005, phase: 4.2 },
];

function drawFog(now) {
  const size = GRID * cell;
  for (const bank of FOG_BANKS) {
    const t = now * bank.speed + bank.phase;
    const cx = (bank.ox + Math.sin(t) * 0.08) * size;
    const cy = (bank.oy + Math.cos(t * 0.8) * 0.08) * size;
    const r = bank.r * size;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grad.addColorStop(0, 'rgba(200, 215, 225, 0.10)');
    grad.addColorStop(1, 'rgba(200, 215, 225, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
  }
}

async function fetchWorld() {
  try {
    const res = await fetch('../state/world.json?_=' + Date.now());
    latestWorld = await res.json();
  } catch (e) {
    stats.textContent = 'could not load state/world.json - run driver.py simulate first, and serve this folder over http:// (not file://)';
  }
}

const latestEvolveEl = document.getElementById('latest-evolve');

// changelog.md is append-only markdown, "## <timestamp>" sections - grab
// whichever one is last and show it. Polled far less often than world.json
// since it only changes once a day.
async function fetchLatestEvolve() {
  try {
    const res = await fetch('../state/changelog.md?_=' + Date.now());
    const text = await res.text();
    const sections = text.split(/\n##\s+/).slice(1);
    if (!sections.length) return;
    const last = sections[sections.length - 1];
    const breakAt = last.indexOf('\n');
    const stamp = (breakAt === -1 ? last : last.slice(0, breakAt)).trim();
    const body = (breakAt === -1 ? '' : last.slice(breakAt)).trim();
    latestEvolveEl.innerHTML =
      `<span class="label">latest evolve</span><span class="stamp">${stamp}</span>` +
      `<div class="entry">${body.replace(/</g, '&lt;')}</div>`;
  } catch (e) {
    // non-critical - just leave whatever was last shown (or nothing)
  }
}

function draw(now) {
  requestAnimationFrame(draw);
  const world = latestWorld;
  if (!world) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawTerrain(world.terrain);

  // resources: small diamonds
  const resourceColor = '#e8c07d';
  for (const r of world.resources || []) {
    const cx = r.x * cell + cell / 2;
    const cy = r.y * cell + cell / 2;
    const s = cell * 0.22;
    ctx.fillStyle = resourceColor;
    ctx.beginPath();
    ctx.moveTo(cx, cy - s); ctx.lineTo(cx + s, cy);
    ctx.lineTo(cx, cy + s); ctx.lineTo(cx - s, cy);
    ctx.closePath();
    ctx.fill();
  }

  // grazers: circle, brightness + size scale with energy, faint glow
  const creatures = world.creatures || [];
  for (const c of creatures) {
    if (c.species === 'hunter') continue;
    const t = Math.max(0, Math.min(1, (c.energy ?? 30) / 80));
    const color = lerpColor('#3f6b52', '#9fffc4', t);
    const r = cell * (0.16 + 0.14 * t);
    const cx = c.x * cell + cell / 2;
    const cy = c.y * cell + cell / 2;

    ctx.shadowColor = color;
    ctx.shadowBlur = 4 + 6 * t;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // hunters: triangle (a predator silhouette, distinct from the grazer dot),
  // red/orange ramp instead of green so the two species read apart at a
  // glance even before you know the shape convention.
  for (const c of creatures) {
    if (c.species !== 'hunter') continue;
    const t = Math.max(0, Math.min(1, (c.energy ?? 30) / 80));
    const color = lerpColor('#6b1f1f', '#ff8f6b', t);
    const r = cell * (0.22 + 0.14 * t);
    const cx = c.x * cell + cell / 2;
    const cy = c.y * cell + cell / 2;

    ctx.shadowColor = color;
    ctx.shadowBlur = 5 + 7 * t;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(cx, cy - r);
    ctx.lineTo(cx + r * 0.87, cy + r * 0.5);
    ctx.lineTo(cx - r * 0.87, cy + r * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  drawDayNight(world.tick);
  drawFog(now);

  const grazerCount = creatures.filter(c => c.species !== 'hunter').length;
  const hunterCount = creatures.filter(c => c.species === 'hunter').length;

  stats.innerHTML =
    `tick <b>${world.tick}</b>` +
    `<span>grazers <b>${world.grazers ?? grazerCount}</b></span>` +
    `<span>hunters <b>${world.hunters ?? hunterCount}</b></span>` +
    `<span>resources <b>${(world.resources || []).length}</b></span>`;
}

fetchWorld();
setInterval(fetchWorld, 3000);
fetchLatestEvolve();
setInterval(fetchLatestEvolve, 30000);
requestAnimationFrame(draw);
</script>
</body>
</html>
